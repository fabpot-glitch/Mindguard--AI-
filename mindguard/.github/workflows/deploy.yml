name: Deploy MindGuard AI

on:
  workflow_run:
    workflows: ["Build MindGuard AI"]
    types:
      - completed
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}-backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}-frontend

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy to staging server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        port: ${{ secrets.STAGING_PORT || '22' }}
        script: |
          cd /opt/mindguard
          
          # Login to container registry
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          
          # Pull latest images
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
          
          # Update docker-compose with latest images
          export BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
          export FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
          
          # Deploy with docker-compose
          docker-compose -f docker-compose.staging.yml up -d --remove-orphans
          
          # Clean up old images
          docker image prune -f
          
          # Run database migrations
          docker exec mindguard-backend python scripts/migrate_db.py
          
          # Health check
          sleep 10
          curl -f http://localhost:8000/api/v1/health || exit 1

    - name: Run smoke tests
      run: |
        curl -f http://${{ secrets.STAGING_HOST }}/api/v1/health
        curl -f http://${{ secrets.STAGING_HOST }}/ | grep -q "MindGuard"

  deploy-production:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    needs: deploy-staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Get commit SHA
      id: get_sha
      run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Deploy to production (Blue-Green)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PROD_HOST }}
        username: ${{ secrets.PROD_USER }}
        key: ${{ secrets.PROD_SSH_KEY }}
        script: |
          cd /opt/mindguard
          
          # Login to container registry
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          
          # Pull specific version
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ steps.get_sha.outputs.sha }}
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ steps.get_sha.outputs.sha }}
          
          # Blue-Green deployment
          # Check which environment is currently active (blue or green)
          if [ -f /opt/mindguard/.active ]; then
            ACTIVE=$(cat /opt/mindguard/.active)
          else
            ACTIVE="blue"
          fi
          
          if [ "$ACTIVE" = "blue" ]; then
            NEW_ENV="green"
            NEW_PORT=8001
          else
            NEW_ENV="blue"
            NEW_PORT=8000
          fi
          
          echo "Deploying to $NEW_ENV environment"
          
          # Deploy new version
          export BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ steps.get_sha.outputs.sha }}
          export FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ steps.get_sha.outputs.sha }}
          export ENV=$NEW_ENV
          export PORT=$NEW_PORT
          
          docker-compose -f docker-compose.prod.yml -p mindguard-$NEW_ENV up -d
          
          # Wait for new version to be healthy
          sleep 30
          curl -f http://localhost:$NEW_PORT/api/v1/health || exit 1
          
          # Update nginx to point to new version
          sed -i "s/proxy_pass http:\/\/localhost:[0-9]\+/proxy_pass http:\/\/localhost:$NEW_PORT/g" /etc/nginx/sites-available/mindguard
          nginx -s reload
          
          # Update active environment
          echo "$NEW_ENV" > /opt/mindguard/.active
          
          # Stop old environment
          docker-compose -f docker-compose.prod.yml -p mindguard-$ACTIVE down
          
          # Clean up
          docker image prune -f

    - name: Notify deployment success
      if: success()
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "text": "✅ MindGuard AI deployed successfully to production\nVersion: ${{ steps.get_sha.outputs.sha }}\nDeployed by: ${{ github.actor }}"
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

    - name: Notify deployment failure
      if: failure()
      uses: slackapi/slack-github-action@v1.25.0
      with:
        payload: |
          {
            "text": "❌ MindGuard AI deployment failed to production\nVersion: ${{ steps.get_sha.outputs.sha }}\nDeployed by: ${{ github.actor }}\nCheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}