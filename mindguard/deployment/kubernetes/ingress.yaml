apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mindguard-ingress
  namespace: mindguard
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/websocket-services: mindguard-backend
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  tls:
  - hosts:
    - mindguard.ai
    - api.mindguard.ai
    secretName: mindguard-tls
  rules:
  - host: mindguard.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mindguard-frontend
            port:
              number: 80
  - host: api.mindguard.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mindguard-backend
            port:
              number: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: mindguard-ingress-nginx
  namespace: ingress-nginx
spec:
  type: LoadBalancer
  ports:
  - port: 80
    name: http
    targetPort: 80
  - port: 443
    name: https
    targetPort: 443
  selector:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/part-of: ingress-nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@mindguard.ai
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx