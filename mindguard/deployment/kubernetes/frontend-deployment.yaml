apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindguard-frontend
  namespace: mindguard
  labels:
    app: mindguard
    component: frontend
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mindguard
      component: frontend
  template:
    metadata:
      labels:
        app: mindguard
        component: frontend
        version: v1
    spec:
      containers:
      - name: frontend
        image: ghcr.io/mindguard-ai/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: REACT_APP_API_URL
          value: "https://api.mindguard.ai"
        - name: REACT_APP_WS_URL
          value: "wss://api.mindguard.ai"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
          readOnly: true
      volumes:
      - name: nginx-config
        configMap:
          name: mindguard-nginx-config
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: mindguard-frontend
  namespace: mindguard
  labels:
    app: mindguard
    component: frontend
spec:
  selector:
    app: mindguard
    component: frontend
  ports:
  - port: 80
    targetPort: 80
    name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mindguard-frontend-hpa
  namespace: mindguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mindguard-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 60