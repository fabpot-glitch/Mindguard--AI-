apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindguard-backend
  namespace: mindguard
  labels:
    app: mindguard
    component: backend
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mindguard
      component: backend
  template:
    metadata:
      labels:
        app: mindguard
        component: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: backend
        image: ghcr.io/mindguard-ai/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8000"
        - name: API_WORKERS
          value: "4"
        - name: API_DEBUG
          value: "false"
        - name: API_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: mindguard-secrets
              key: api-secret-key
        - name: MODEL_DEVICE
          value: "cpu"
        - name: MODEL_PATH
          value: "/app/models/weights/mindguard_best.pt"
        - name: LOG_LEVEL
          value: "INFO"
        - name: REDIS_URL
          value: "redis://mindguard-redis:6379"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mindguard-secrets
              key: database-url
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: models
          mountPath: /app/models/weights
        - name: data
          mountPath: /app/data
        - name: logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/config
          readOnly: true
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: mindguard-models-pvc
      - name: data
        persistentVolumeClaim:
          claimName: mindguard-data-pvc
      - name: logs
        emptyDir: {}
      - name: config
        configMap:
          name: mindguard-config
      serviceAccountName: mindguard-sa
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: mindguard-backend
  namespace: mindguard
  labels:
    app: mindguard
    component: backend
spec:
  selector:
    app: mindguard
    component: backend
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  - port: 9090
    targetPort: 9090
    name: metrics
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mindguard-backend-hpa
  namespace: mindguard
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mindguard-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mindguard-backend-pdb
  namespace: mindguard
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mindguard
      component: backend